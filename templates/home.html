
{% extends 'master.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-4">
            <h2>Register Here</h2>
            <form action="/submit" method="post">

                {% csrf_token %}

                <div class="mb-3 mt-3">
                    <label for="names" class="form-label">Names:</label>
                    <input type="text" required class="form-control" id="names" placeholder="Enter names" name="names">
                </div>

                <div class="mb-3 mt-3">
                    <label for="phone" class="form-label">Phone:</label>
                    <input type="number" required class="form-control" id="phone" placeholder="Enter phone" name="phone">
                </div>

                <div class="mb-3 mt-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="text" required class="form-control" id="email" placeholder="Enter email" name="email">
                </div>

                <div class="mb-3 mt-3">
                    <label for="dob" class="form-label">Date of Birth:</label>
                    <input type="date" required class="form-control" id="dob" placeholder="Enter dob" name="dob">
                </div>

                <div class="mb-3 mt-3">
                    <label for="Weight" class="form-label">Weight:</label>
                    <input type="number" required class="form-control" id="Weight" placeholder="Enter Weight"
                           name="weight">
                </div>

                <div class="mb-3 mt-3">
                    <label for="Height" class="form-label">Height:</label>
                    <input type="number" required class="form-control" id="Height" placeholder="Enter Height"
                           name="height">
                </div>

                <p>Select Gender</p>
                    <input type="radio" class="form-check-input" id="Male" name="gender" value="Male" checked>Male
                    <label class="form-check-label" for="Male"></label>

                    <input type="radio" class="form-check-input" id="Female" name="gender" value="Female">Female
                    <label class="form-check-label" for="Female"></label>

                <button class="btn btn-danger w-100">Register</button>

            </form>
        </div>
    </div>
</div>



{% endblock %}
