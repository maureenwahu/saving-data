
    {% extends 'master.html' %}

    {% block content %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-6">
            <h2>{{ person.name }}</h2>
            <p>{{ person.email }}</p>
            <p>{{ person.phone }}</p>
            <p>{{ person.dob }}</p>
            <p> weight {{ person.weight }} kgs</p>
            <p> height {{ person.height }} cm</p>
        </div>
    </div>
</div>


{% endblock %}
