<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-4">
            <h2>Register Here</h2>
            <form action="/submit" method="post">

                {% csrf_token %}

                <div class="mb-3 mt-3">
                    <label for="names" class="form-label">Names:</label>
                    <input type="names" required class="form-control" id="names" placeholder="Enter names" name="names">
                </div>

                <div class="mb-3 mt-3">
                    <label for="phone" class="form-label">Phone:</label>
                    <input type="tel" required class="form-control" id="phone" placeholder="Enter phone" name="phone">
                </div>

                <div class="mb-3 mt-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" required class="form-control" id="email" placeholder="Enter email" name="email">
                </div>

                <div class="mb-3 mt-3">
                    <label for="dob" class="form-label">Date of Birth:</label>
                    <input type="date" required class="form-control" id="dob" placeholder="Enter dob" name="dob">
                </div>

                <div class="mb-3 mt-3">
                    <label for="Weight" class="form-label">Weight:</label>
                    <input type="Weight" required class="form-control" id="Weight" placeholder="Enter Weight"
                           name="Weight">
                </div>

                <div class="mb-3 mt-3">
                    <label for="Height" class="form-label">Height:</label>
                    <input type="Height" required class="form-control" id="Height" placeholder="Enter Height"
                           name="Height">
                </div>

                <p>Select Gender</p>
                    <input type="radio" class="form-check-input" id="Male" name="optradio" value="Male" checked>Male
                    <label class="form-check-label" for="Male"></label>

                    <input type="radio" class="form-check-input" id="Female" name="optradio" value="Female">Female
                    <label class="form-check-label" for="Female"></label>

                <button class="btn btn-danger w-100">Register</button>

            </form>
        </div>
    </div>
</div>


</body>
</html>
